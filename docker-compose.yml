services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: obraflow
      POSTGRES_PASSWORD: obraflow
      POSTGRES_DB: dokimos
    ports:
      # 5433 no host para não conflitar com um Postgres local na 5432
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraflow -d dokimos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
