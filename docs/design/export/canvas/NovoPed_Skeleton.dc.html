<x-dc>
<helmet>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="./support.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--surface:#fff;--surface2:#f4f4f5;--border:#e4e4e7;
  --text:#09090b;--text2:#52525b;--muted:#a1a1aa;
  --sb:#18181b;--sb-border:#27272a;--sb-txt:#a1a1aa;--sb-active:#27272a;--sb-atxt:#fff;
  --accent:#d97706;--accent-lt:#fffbeb;--accent-bd:#fde68a;--accent-dk:#92400e;
  --green:#16a34a;--green-lt:#f0fdf4;--green-bd:#bbf7d0;
  --radius:8px;
}
body{display:flex;height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--text)}
.sidebar{width:220px;background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--sb-border)}
.logo{padding:20px 16px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sb-border)}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:grid;place-items:center}
.logo-mark svg{color:#fff}
.logo-name{color:#fff;font-weight:700;font-size:15px;letter-spacing:-.3px}
.logo-sub{color:var(--sb-txt);font-size:11px;margin-top:1px}
.nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--sb-txt);text-decoration:none;font-size:13px;font-weight:500;transition:background .15s}
.nav-item:hover{background:var(--sb-active);color:#fff}
.nav-item.active{background:var(--sb-active);color:var(--sb-atxt)}
.nav-sep{height:1px;background:var(--sb-border);margin:8px 0}
.user-row{padding:12px 16px;border-top:1px solid var(--sb-border);display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.av-bl{background:#fef3c7;color:#92400e}
.user-name{color:#fff;font-size:12px;font-weight:600;line-height:1.2}
.user-role{color:var(--sb-txt);font-size:11px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:57px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;background:var(--surface)}
.page-title{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--text)}
.topbar-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:3px 10px;border-radius:20px}
.content{flex:1;overflow-y:auto;padding:28px}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:860px}
.section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px}
.field{margin-bottom:20px}
.label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.label .req{color:var(--accent)}
/* Shimmer */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.sk{border-radius:6px;background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:1200px 100%;animation:shimmer 1.5s infinite}
.sk-input{height:38px;width:100%}
.sk-input-sm{height:38px;width:200px}
.sk-text{height:14px;border-radius:4px}
.sk-row{display:grid;gap:16px}
.sk-2{grid-template-columns:1fr 1fr}
.sk-3{grid-template-columns:1fr 1fr 1fr}
/* Real inputs (date is real) */
.input{height:38px;border:1px solid var(--border);border-radius:6px;padding:0 12px;font-size:14px;color:var(--text);background:var(--surface);width:100%;outline:none}
/* Table skeleton */
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.table-head{display:grid;grid-template-columns:1fr 120px 120px 120px 44px;background:var(--surface2);border-bottom:1px solid var(--border);padding:10px 16px;gap:12px}
.th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sk-table-row{display:grid;grid-template-columns:1fr 120px 120px 120px 44px;padding:14px 16px;gap:12px;border-bottom:1px solid var(--border);align-items:center}
.sk-table-row:last-child{border-bottom:none}
/* Add row button skeleton */
.add-btn-sk{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--surface2)}
/* Alçada preview skeleton */
.alcada-preview-sk{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px}
.ap-icon-sk{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.ap-lines{flex:1;display:flex;flex-direction:column;gap:8px}
/* Loading spinner on select */
.select-wrap{position:relative}
.select-loading{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.select-disabled{height:38px;border:1px solid var(--border);border-radius:6px;padding:0 36px 0 12px;font-size:14px;color:var(--muted);background:var(--surface2);width:100%;cursor:not-allowed;display:flex;align-items:center}
/* Footer */
.form-footer{display:flex;justify-content:flex-end;gap:12px;padding-top:20px;border-top:1px solid var(--border);margin-top:4px}
.btn{height:38px;padding:0 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-primary{background:var(--accent);color:#fff;opacity:.5;cursor:not-allowed}
/* Loading notice */
.loading-notice{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:8px 0}
</style>
</helmet>

<div class="sidebar">
  <div class="logo">
    <div class="logo-mark">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div>
      <div class="logo-name">ObraFlow</div>
      <div class="logo-sub">Dokimos</div>
    </div>
  </div>
  <nav class="nav">
    <a class="nav-item" href="#">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Obras
    </a>
    <a class="nav-item active" href="#">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Pedidos
    </a>
    <div class="nav-sep"></div>
    <a class="nav-item" href="#">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Alçadas
    </a>
  </nav>
  <div class="user-row">
    <div class="avatar av-bl">BL</div>
    <div>
      <div class="user-name">Beatriz Lima</div>
      <div class="user-role">Compradora</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h1 class="page-title">Novo Pedido</h1>
    <div class="topbar-badge">
      <div class="spinner" style="width:12px;height:12px;border-width:1.5px"></div>
      Carregando dados…
    </div>
  </div>
  <div class="content">
    <div class="form-card">

      <!-- Obra -->
      <div class="field">
        <div class="label">Obra <span class="req">*</span></div>
        <div class="select-wrap">
          <div class="select-disabled">Carregando obras…</div>
          <div class="select-loading"><div class="spinner"></div></div>
        </div>
        <div class="loading-notice">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          Buscando obras disponíveis no servidor…
        </div>
      </div>

      <!-- Data e Observações (reais, não skeleton) -->
      <div class="sk-row sk-2" style="margin-bottom:20px">
        <div class="field" style="margin:0">
          <div class="label">Data de entrega <span class="req">*</span></div>
          <input class="input" type="date" value="" placeholder="dd/mm/aaaa" disabled style="opacity:.5;cursor:not-allowed;background:var(--surface2)">
        </div>
        <div class="field" style="margin:0">
          <div class="label">Referência interna</div>
          <input class="input" type="text" placeholder="Ex: OS-2024-089" disabled style="opacity:.5;cursor:not-allowed;background:var(--surface2)">
        </div>
      </div>

      <!-- Itens — skeleton -->
      <div class="section-title">Itens do pedido</div>
      <div class="table-wrap">
        <div class="table-head">
          <div class="th">Produto / Serviço</div>
          <div class="th">Unidade</div>
          <div class="th">Qtd.</div>
          <div class="th">Valor unit.</div>
          <div class="th"></div>
        </div>
        <!-- Skeleton row 1 -->
        <div class="sk-table-row">
          <div class="sk sk-text" style="width:65%"></div>
          <div class="sk sk-text" style="width:60px"></div>
          <div class="sk sk-text" style="width:40px"></div>
          <div class="sk sk-text" style="width:80px"></div>
          <div class="sk" style="width:28px;height:28px;border-radius:6px"></div>
        </div>
        <!-- Skeleton row 2 -->
        <div class="sk-table-row">
          <div class="sk sk-text" style="width:50%"></div>
          <div class="sk sk-text" style="width:60px"></div>
          <div class="sk sk-text" style="width:40px"></div>
          <div class="sk sk-text" style="width:80px"></div>
          <div class="sk" style="width:28px;height:28px;border-radius:6px"></div>
        </div>
        <!-- Skeleton row 3 -->
        <div class="sk-table-row">
          <div class="sk sk-text" style="width:42%"></div>
          <div class="sk sk-text" style="width:60px"></div>
          <div class="sk sk-text" style="width:40px"></div>
          <div class="sk sk-text" style="width:80px"></div>
          <div class="sk" style="width:28px;height:28px;border-radius:6px"></div>
        </div>
        <div class="add-btn-sk">
          <div class="sk" style="width:16px;height:16px;border-radius:50%"></div>
          <div class="sk sk-text" style="width:90px"></div>
        </div>
      </div>

      <!-- Total skeleton -->
      <div style="display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-bottom:20px">
        <div style="font-size:12px;color:var(--muted)">Total estimado</div>
        <div class="sk sk-text" style="width:110px;height:20px"></div>
      </div>

      <!-- Alçada preview skeleton -->
      <div class="section-title">Alçada de aprovação</div>
      <div class="alcada-preview-sk">
        <div class="sk ap-icon-sk"></div>
        <div class="ap-lines">
          <div class="sk sk-text" style="width:55%"></div>
          <div class="sk sk-text" style="width:38%;margin-top:2px"></div>
        </div>
      </div>

      <!-- Footer -->
      <div class="form-footer">
        <button class="btn btn-ghost">Cancelar</button>
        <button class="btn btn-primary" disabled>Cadastrar pedido</button>
      </div>

    </div>
  </div>
</div>
</x-dc>
