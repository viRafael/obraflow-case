<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pedidos · Carregando — ObraFlow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f4f5;--surface:#fff;--surface2:#f9fafb;
  --border:#e4e4e7;--border2:#f4f4f5;
  --text:#18181b;--text2:#3f3f46;--muted:#71717a;
  --sb:#18181b;--sb-border:#27272a;--sb-txt:#a1a1aa;--sb-active:#27272a;--sb-atxt:#fafafa;
  --accent:#d97706;--accent-lt:#fef3c7;--accent-bd:#fde68a;--accent-dk:#92400e;
  --sk-base:#e4e4e7;--sk-shine:#f4f4f5;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#09090b;--surface:#18181b;--surface2:#27272a;
    --border:#27272a;--border2:#3f3f46;
    --text:#fafafa;--text2:#d4d4d8;--muted:#a1a1aa;
    --sb:#09090b;--sb-border:#18181b;--sb-txt:#71717a;--sb-active:#18181b;--sb-atxt:#fafafa;
    --accent-lt:#2d1a00;--accent-bd:#78350f;--accent-dk:#fbbf24;
    --sk-base:#27272a;--sk-shine:#3f3f46;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.app{display:flex;min-height:100vh}
.sb{width:240px;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column}
.sb-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--sb-border)}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.logo-txt{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px}
.sb-nav{padding:10px 8px;flex:1}
.nav-a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--sb-txt);font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;margin-bottom:2px}
.nav-a.active{background:var(--sb-active);color:var(--sb-atxt)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.pg-title{font-size:15px;font-weight:600}
.user-sel{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:500}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.viewing{display:flex;align-items:center;gap:8px}
.viewing-lbl{font-size:12.5px;color:var(--muted)}
.tabs-bar{display:flex;align-items:center;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);height:44px;flex-shrink:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.filters{display:flex;align-items:center;gap:10px;padding:14px 24px;flex-shrink:0}
.filter-sk{height:36px;border-radius:6px;background:var(--sk-base)}
/* Skeleton shimmer */
@keyframes shimmer{
  0%{background-position:-400px 0}
  100%{background-position:400px 0}
}
.sk{border-radius:5px;background:linear-gradient(90deg, var(--sk-base) 25%, var(--sk-shine) 50%, var(--sk-base) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear}
/* Table skeleton */
.tbl-wrap{flex:1;padding:0 24px 24px}
table{width:100%;border-collapse:collapse}
thead th{padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface);border-bottom:1px solid var(--border)}
tbody tr{background:var(--surface);border-bottom:1px solid var(--border2)}
tbody td{padding:16px 12px;vertical-align:middle}
.sk-row{display:flex;flex-direction:column;gap:6px}
.sk-line{height:10px}
.sk-sm{width:50%;height:9px;opacity:.6}
.sk-badge{width:72px;height:22px;border-radius:5px}
.sk-circle{width:24px;height:24px;border-radius:50%;display:inline-block}
.sk-btn{width:80px;height:28px;border-radius:6px;display:inline-block}
</style>
</helmet>

<div class="app">
  <aside class="sb" aria-label="Navegação">
    <div class="sb-logo">
      <div class="logo-mark" aria-hidden="true">O</div>
      <span class="logo-txt">ObraFlow</span>
    </div>
    <nav class="sb-nav">
      <a class="nav-a active" href="#" aria-current="page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 12 2 2 4-4"/></svg>
        Pedidos
      </a>
      <a class="nav-a" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo pedido</a>
      <a class="nav-a" href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Alçadas</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="pg-title">Pedidos</span>
      <div class="viewing">
        <span class="viewing-lbl">Visualizando como</span>
        <div class="user-sel">
          <div class="av" aria-hidden="true">AC</div>
          Amanda Costa

        </div>
      </div>
    </header>

    <!-- Tabs: badges loading -->
    <div class="tabs-bar" aria-busy="true" aria-label="Carregando abas">
      <a class="tab active">Aguardando minha decisão <span style="display:inline-block;width:16px;height:16px;border-radius:8px;margin-left:4px" class="sk"></span></a>
      <a class="tab">Pendentes</a>
      <a class="tab">Aprovados</a>
      <a class="tab">Rejeitados</a>
      <a class="tab">Todos</a>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-sk sk" style="width:280px;height:36px"></div>
      <div class="filter-sk sk" style="width:180px;height:36px"></div>
    </div>

    <!-- Table skeleton -->
    <div class="tbl-wrap" aria-busy="true" aria-label="Carregando pedidos">

        <thead>
          <tr>

            <th>Obra</th>

        </thead>
        <tbody>
          <!-- 5 skeleton rows -->
          <tr>

            <td style="text-align:right"><div class="sk sk-line" style="width:90px;margin-left:auto"></div></td>
            <td><div class="sk sk-badge"></div></td>
            <td><div style="display:flex;align-items:center;gap:6px"><div class="sk sk-circle"></div><div class="sk" style="width:14px;height:2px"></div><div class="sk sk-circle"></div><div class="sk" style="width:14px;height:2px"></div><div class="sk sk-circle"></div></div></td>
            <td><div class="sk sk-btn"></div></td>
          </tr>
          <tr>
            <td><div class="sk-row"><div class="sk sk-line" style="width:65%"></div><div class="sk sk-sm" style="width:45%"></div></div></td>
            <td><div class="sk sk-line" style="width:70%"></div></td>
            <td><div class="sk sk-line" style="width:90%"></div></td>
            <td style="text-align:center"><div class="sk sk-line" style="width:20px;margin:0 auto"></div></td>
            <td style="text-align:right"><div class="sk sk-line" style="width:100px;margin-left:auto"></div></td>
            <td><div class="sk sk-badge" style="width:68px"></div></td>
            <td><div style="display:flex;align-items:center;gap:6px"><div class="sk sk-circle"></div></div></td>
            <td><div class="sk sk-btn" style="width:110px"></div></td>
          </tr>
          <tr>
            <td><div class="sk-row"><div class="sk sk-line" style="width:72%"></div><div class="sk sk-sm" style="width:55%"></div></div></td>
            <td><div class="sk sk-line" style="width:75%"></div></td>
            <td><div class="sk sk-line" style="width:82%"></div></td>
            <td style="text-align:center"><div class="sk sk-line" style="width:20px;margin:0 auto"></div></td>
            <td style="text-align:right"><div class="sk sk-line" style="width:95px;margin-left:auto"></div></td>
            <td><div class="sk sk-badge"></div></td>
            <td><div style="display:flex;align-items:center;gap:6px"><div class="sk sk-circle"></div><div class="sk" style="width:14px;height:2px"></div><div class="sk sk-circle"></div></div></td>
            <td><div class="sk sk-btn"></div></td>
          </tr>
          <tr>
            <td><div class="sk-row"><div class="sk sk-line" style="width:68%"></div><div class="sk sk-sm"></div></div></td>
            <td><div class="sk sk-line" style="width:88%"></div></td>
            <td><div class="sk sk-line" style="width:78%"></div></td>
            <td style="text-align:center"><div class="sk sk-line" style="width:20px;margin:0 auto"></div></td>
            <td style="text-align:right"><div class="sk sk-line" style="width:88px;margin-left:auto"></div></td>
            <td><div class="sk sk-badge" style="width:65px"></div></td>

          </tr>
          <tr>
            <td><div class="sk-row"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-sm" style="width:50%"></div></div></td>
            <td><div class="sk sk-line" style="width:65%"></div></td>
            <td><div class="sk sk-line" style="width:92%"></div></td>
            <td style="text-align:center"><div class="sk sk-line" style="width:20px;margin:0 auto"></div></td>
            <td style="text-align:right"><div class="sk sk-line" style="width:92px;margin-left:auto"></div></td>
            <td><div class="sk sk-badge"></div></td>
            <td><div style="display:flex;align-items:center;gap:6px"><div class="sk sk-circle"></div><div class="sk" style="width:14px;height:2px"></div><div class="sk sk-circle"></div><div class="sk" style="width:14px;height:2px"></div><div class="sk sk-circle"></div></div></td>
            <td><div class="sk sk-btn"></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</x-dc>
